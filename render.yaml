services:
  - type: web
    name: scanio-ai-backend
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.8
      - key: VISION_PROVIDER
        value: nvidia
      - key: NVIDIA_MODEL
        value: nvidia/nemotron-3.5-super-vl-120b-a12b
      - key: NVIDIA_BASE_URL
        value: https://integrate.api.nvidia.com/v1
      - key: MAX_IMAGE_BYTES
        value: "8000000"
      - key: CORS_ORIGIN_REGEX
        value: ^https://.*\.vercel\.app$
      - key: NVIDIA_API_KEY
        sync: false
